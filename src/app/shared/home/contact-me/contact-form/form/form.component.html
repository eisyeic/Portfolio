<form
  class="contact-form"
  action="https://formspree.io/f/xykkkybo"
  method="POST"
  #contactForm="ngForm"
  (ngSubmit)="submitForm($event, contactForm)"
>
  <div class="form-container">
    <div class="row">
      <div class="field">
        <label class="input-label">{{ 'FORM_NAME_LABEL' | translate }}</label>
        <input 
          #nameInput 
          type="text" 
          name="name" 
          required 
          placeholder="{{ 'FORM_NAME_LABEL' | translate }}"
          [(ngModel)]="name"
          (blur)="onFieldBlur('name')"
          (input)="onInputChange('name')" />
        <div class="error-message" *ngIf="nameError">
          {{ 'FORM_NAME_ERROR' | translate }}
        </div>
      </div>

      <div class="field">
        <label class="input-label">{{ 'FORM_EMAIL_LABEL' | translate }}</label>
        <input 
          #emailInput 
          type="email" 
          name="email" 
          required 
          placeholder="{{ 'FORM_EMAIL_LABEL' | translate }}"
          [(ngModel)]="email"
          (blur)="onFieldBlur('email')"
          (input)="onInputChange('email')" />
        <div class="error-message" *ngIf="emailError">
          {{ 'FORM_EMAIL_ERROR' | translate }}
        </div>
      </div>
    </div>

    <div class="field">
      <label class="input-label">{{ 'FORM_MESSAGE_LABEL' | translate }}</label>
      <textarea 
        #messageInput 
        name="message" 
        required 
        placeholder="{{ 'FORM_MESSAGE_LABEL' | translate }}"
        [(ngModel)]="message"
        (blur)="onFieldBlur('message')"
        (input)="onInputChange('message')"></textarea>
      <div class="error-message" *ngIf="messageError">
        {{ 'FORM_MESSAGE_ERROR' | translate }}
      </div>
    </div>

    <input type="hidden" name="_subject" value="New contact request" />
    <input type="text" name="_gotcha" style="display:none">

    <div class="bottom">
      <div
        class="checkbox"
        [class.checked]="isChecked"
        [class.error]="isError"
        (click)="toggleCheckbox()"
      >
        <img *ngIf="isError" src="/assets/img/contact-me/checkbox-error.svg">
        <img *ngIf="!isError && isChecked" src="/assets/img/contact-me/checkbox-checked.svg">
        <img *ngIf="!isError && !isChecked" src="/assets/img/contact-me/checkbox-default.svg">

        <p>
          {{ 'FORM_PRIVACY_TEXT_BEFORE' | translate }}
          <a href="/privacy-policy" (click)="$event.stopPropagation()">{{ 'FORM_PRIVACY_LINK' | translate }}</a>
          {{ 'FORM_PRIVACY_TEXT_AFTER' | translate }}
        </p>
      </div>

      <button
        type="submit"
        [disabled]="!isFormValid()"
      >
        {{ 'FORM_SEND_BUTTON' | translate }}
      </button>
    </div>
  </div>
</form>

<div class="popup-overlay" *ngIf="showPopup">
  <div class="popup">
    <p>{{ 'FORM_POPUP_SUCCESS' | translate }}</p>
    <button (click)="closePopup()">{{ 'FORM_POPUP_OK' | translate }}</button>
  </div>
</div>
